name: Pruebas

on:
  push:
    branches-ignore:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Analizar codigo con pylint
        uses: advanced-security/python-lint-code-scanning-action@v1
        with:
          linter: pylint
